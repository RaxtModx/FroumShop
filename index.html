<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coins Store - Admin & Users</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Inter,Arial,sans-serif;margin:0}
.login-card{max-width:450px;margin:6vh auto;background:#111;padding:30px;border-radius:12px;border:1px solid #c20000;box-shadow:0 8px 25px rgba(0,0,0,0.6)}
input{background:#0c0c0c;border:1px solid #333;color:#fff;border-radius:6px;padding:10px;width:100%}
.btn-red{background:#c20000;color:#fff;border:none}
.btn-red:hover{background:#ff0000}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#050505;border-bottom:3px solid #c20000}
.coins-box{background:#c20000;padding:6px 12px;border-radius:20px;font-weight:700}
.container-main{padding:24px}
.product-card{background:#111;border:1px solid #222;border-radius:12px;padding:12px;text-align:center}
.product-card img{width:100%;height:160px;object-fit:cover;border-radius:8px}
.admin-panel{background:#0f0f0f;padding:16px;border-radius:10px;margin-top:20px}
.table-dark th,.table-dark td{vertical-align:middle}
.videoBox{background:#000;padding:15px;border-radius:10px;text-align:center;margin-top:20px}
#history{display:none;margin-top:30px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="authView">
  <div id="loginBox" class="login-card">
    <h3 class="text-center mb-3">Bienvenido</h3>
    <input id="email" placeholder="Correo" class="mb-3">
    <input id="password" placeholder="Contraseña" type="password" class="mb-3">
    <button class="btn btn-red w-100 mb-2" onclick="login()">Iniciar sesión</button>
    <button class="btn btn-outline-light w-100" onclick="showRegister()">Crear cuenta</button>
  </div>

  <div id="registerBox" class="login-card" style="display:none;">
    <h3 class="text-center mb-3">Crear cuenta</h3>
    <input id="regEmail" placeholder="Correo" class="mb-3">
    <input id="regPassword" placeholder="Contraseña" type="password" class="mb-3">
    <button class="btn btn-red w-100 mb-2" onclick="register()">Registrar</button>
    <button class="btn btn-outline-light w-100" onclick="showLogin()">Volver</button>
  </div>
</div>

<!-- HEADER -->
<header id="mainHeader" style="display:none;">
  <h4>🛒 Coins Store</h4>
  <div style="display:flex;gap:10px;align-items:center">
    <div class="coins-box"><span id="coins">0</span> Coins</div>
    <button class="btn btn-outline-light" onclick="logout()">Cerrar sesión</button>
  </div>
</header>

<!-- APP -->
<main id="app" style="display:none" class="container-main">
  <div id="userView">
    <h3>Tienda de Productos</h3>
    <div id="products" class="row g-3"></div>

    <div class="videoBox" id="videoBox">
      <h5>🎬 Ver anuncio para ganar coins</h5>
      <button class="btn btn-red mt-2" onclick="watchAd()">Ver anuncio</button>
    </div>

    <div id="history">
      <h4>🧾 Historial de compras</h4>
      <table class="table table-dark table-bordered mt-3">
        <thead><tr><th>Producto</th><th>Precio</th><th>Fecha</th></tr></thead>
        <tbody id="purchaseList"></tbody>
      </table>
      <button class="btn btn-outline-light" onclick="toggleHistory()">Ocultar historial</button>
    </div>
    <button class="btn btn-outline-light mt-3" onclick="toggleHistory()">Ver historial</button>
  </div>

  <div id="adminView" style="display:none;">
    <h3>Panel de Administrador</h3>
    <div class="admin-panel">
      <h5>Usuarios</h5>
      <table class="table table-dark table-striped mt-2">
        <thead><tr><th>Correo</th><th>Coins</th></tr></thead>
        <tbody id="usersTable"></tbody>
      </table>

      <hr>
      <h5>Agregar Producto</h5>
      <input id="prodName" placeholder="Nombre del producto" class="mb-2">
      <input id="prodImg" placeholder="URL de la imagen" class="mb-2">
      <input id="prodPrice" placeholder="Precio (coins)" type="number" class="mb-2">
      <button class="btn btn-red w-100" onclick="addProduct()">Agregar</button>
    </div>
  </div>
</main>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAaECyPbRGtPf3-of_uWflCe-p76eOVb_U",
  authDomain: "coins-20081.firebaseapp.com",
  projectId: "coins-20081",
  storageBucket: "coins-20081.firebasestorage.app",
  messagingSenderId: "826169825033",
  appId: "1:826169825033:web:c957dec918eb36c97da5d8"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Helpers
const el=id=>document.getElementById(id);
function showEl(id){el(id).style.display='block'}
function hideEl(id){el(id).style.display='none'}

// UI Navigation
function showRegister(){hideEl('loginBox');showEl('registerBox')}
function showLogin(){hideEl('registerBox');showEl('loginBox')}

// Register
async function register(){
  const email=el('regEmail').value, pass=el('regPassword').value;
  try{
    const userCred = await auth.createUserWithEmailAndPassword(email,pass);
    await userCred.user.sendEmailVerification();
    await db.collection('users').doc(userCred.user.uid).set({email,coins:0,role:'user'});
    Swal.fire('Cuenta creada','Verifica tu correo antes de ingresar','success');
    showLogin();
  }catch(e){Swal.fire('Error',e.message,'error')}
}

// Login
async function login(){
  const email=el('email').value, pass=el('password').value;
  try{
    const userCred = await auth.signInWithEmailAndPassword(email,pass);
    const user = userCred.user;
    if(!user.emailVerified){
      Swal.fire('Verifica tu correo','Debes verificar antes de ingresar','warning');
      await auth.signOut();
      return;
    }
    loadApp(user);
  }catch(e){Swal.fire('Error',e.message,'error')}
}

// Logout
async function logout(){
  await auth.signOut();
  hideEl('mainHeader');hideEl('app');
  showEl('authView');showLogin();
}

// Load app
async function loadApp(user){
  hideEl('authView');showEl('mainHeader');showEl('app');
  const doc=await db.collection('users').doc(user.uid).get();
  const data=doc.data();
  el('coins').innerText=data.coins;
  if(data.role==='admin'){showEl('adminView');hideEl('userView');loadUsers();}
  else{showEl('userView');hideEl('adminView');loadProducts();}
  showEl('videoBox');
}

// Load users (admin)
async function loadUsers(){
  const snap=await db.collection('users').get();
  let html='';
  snap.forEach(d=>{
    const u=d.data();
    html+=`<tr><td>${u.email}</td><td>${u.coins}</td></tr>`;
  });
  el('usersTable').innerHTML=html;
}

// Add product
async function addProduct(){
  const name=el('prodName').value,img=el('prodImg').value,price=parseInt(el('prodPrice').value);
  if(!name||!img||!price)return Swal.fire('Error','Completa todos los campos','error');
  await db.collection('products').add({name,img,price});
  Swal.fire('Producto agregado','Se añadió correctamente','success');
  el('prodName').value=el('prodImg').value=el('prodPrice').value='';
  loadProducts();
}

// Load products
async function loadProducts(){
  const snap=await db.collection('products').get();
  let html='';
  snap.forEach(p=>{
    const d=p.data();
    const id=p.id;
    html+=`
    <div class="col-md-4">
      <div class="product-card">
        <img src="${d.img}">
        <h6 class="mt-2">${d.name}</h6>
        <p>${d.price} Coins</p>
        <button class="btn btn-red w-100" onclick="buyProduct('${id}','${d.name}',${d.price})">Comprar</button>
      </div>
    </div>`;
  });
  el('products').innerHTML=html;
}

// Buy product
async function buyProduct(id, name, price){
  const user = auth.currentUser;
  if (!user) return Swal.fire('Error','Debes iniciar sesión','error');
  const userRef = db.collection('users').doc(user.uid);
  const snap = await userRef.get();
  let coins = snap.data().coins || 0;
  if (coins < price) return Swal.fire('Sin coins suficientes','No tienes suficientes coins','warning');
  await userRef.update({coins: coins - price});
  await db.collection('purchases').add({
    userId: user.uid, productId: id, productName: name, price,
    date: firebase.firestore.FieldValue.serverTimestamp()
  });
  el('coins').innerText = coins - price;
  Swal.fire('✅ Compra realizada','Se descontaron los coins','success');
}

// History
async function loadHistory(){
  const user=auth.currentUser;
  const snap=await db.collection('purchases').where('userId','==',user.uid).orderBy('date','desc').get();
  let html='';
  snap.forEach(doc=>{
    const d=doc.data();
    const fecha=d.date?d.date.toDate().toLocaleString():'-';
    html+=`<tr><td>${d.productName}</td><td>${d.price}</td><td>${fecha}</td></tr>`;
  });
  el('purchaseList').innerHTML=html;
}

function toggleHistory(){
  const h=el('history');
  if(h.style.display==='none'){h.style.display='block';loadHistory();}
  else{h.style.display='none';}
}

// Watch ad
async function watchAd(){
  Swal.fire({
    title:'Anuncio',
    html:'<b>Viendo anuncio...</b>',
    timer:5000,
    timerProgressBar:true,
    allowOutsideClick:false
  }).then(async()=>{
    const user=auth.currentUser;
    const ref=db.collection('users').doc(user.uid);
    const doc=await ref.get();
    let coins=doc.data().coins+10;
    await ref.update({coins});
    el('coins').innerText=coins;
    Swal.fire('¡Listo!','Ganaste 10 coins','success');
  });
}
</script>
</body>
</html>
